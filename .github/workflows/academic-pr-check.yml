name: Validate Academic Upgrade Phase 2
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source
        run: npm run check
      - name: Test
        run: npm test
      - name: Build without production credentials
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: pr-validation-only-not-a-real-key
          BASE_PATH: /student-monitoring-system/
        run: npm run build
